# fly.toml - for nfc-sticker-be (Rails + Docker)
app = "nfc-sticker-be"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  RAILS_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
