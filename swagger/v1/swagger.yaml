---
openapi: 3.0.1
info:
  title: NFC Sticker Backend API
  version: v1
  description: |
    NFC Sticker Backend API - 楽曲共有プラットフォーム

    このAPIは、NFCステッカーを通じて楽曲を共有するためのプラットフォームです。
    ユーザーは楽曲をアップロードし、パスワードで保護された楽曲を他のユーザーと共有できます。

    ## 認証
    JWT認証を使用しています。ログイン後、レスポンスヘッダーの `Authorization` フィールドに含まれるトークンを
    後続のリクエストに含めてください。

    ### 認証エラーについて
    - **401 Unauthorized**: 認証が必要なエンドポイントに未認証でアクセスした場合
    - **Token Expired**: JWTトークンの有効期限が切れた場合
    - **Invalid Token**: 無効または破損したJWTトークンが提供された場合
    - **Login Failed**: ログイン時に無効な認証情報が提供された場合

    ## エラーレスポンス
    すべてのエラーレスポンスは以下の形式で返されます:
    ```json
    {
      "error": "エラーメッセージ",
      "message": "詳細なエラーメッセージ",
      "error_code": "ERROR_CODE"
    }
    ```

    ### 一般的なHTTPステータスコード
    - **200 OK**: リクエスト成功
    - **400 Bad Request**: リクエストパラメータが無効
    - **401 Unauthorized**: 認証が必要または認証失敗
    - **403 Forbidden**: アクセス権限がない
    - **404 Not Found**: リソースが見つからない
    - **422 Unprocessable Entity**: バリデーションエラー
    - **500 Internal Server Error**: サーバー内部エラー

  contact:
    name: NFC Sticker API Support
    email: support@nfcsticker.com

paths:
  # Authentication Endpoints
  '/signup':
    post:
      summary: ユーザー新規登録
      tags:
        - Authentication
      description: 新しいユーザーアカウントを作成します
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      example: user@example.com
                    name:
                      type: string
                      example: 田中太郎
                    password:
                      type: string
                      format: password
                      example: password123
                    password_confirmation:
                      type: string
                      format: password
                      example: password123
                  required:
                    - email
                    - name
                    - password
                    - password_confirmation
      responses:
        '200':
          description: 登録成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Signed up successfully.
                  user:
                    '$ref': '#/components/schemas/User'
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Signed up failure.
                  errors:
                    type: array
                    items:
                      type: string
                    example:
                      ['Email has already been taken', 'Password is too short']

  '/login':
    post:
      summary: ユーザーログイン
      tags:
        - Authentication
      description: ユーザーアカウントにログインします
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      example: user@example.com
                    password:
                      type: string
                      format: password
                      example: password123
                  required:
                    - email
                    - password
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged in successfully.
                  user:
                    '$ref': '#/components/schemas/User'
          headers:
            Authorization:
              description: JWT認証トークン
              schema:
                type: string
                example: Bearer eyJhbGciOiJIUzI1NiJ9...
        '401':
          description: 認証失敗
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/LoginError'
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ValidationError'

  '/logout':
    delete:
      summary: ユーザーログアウト
      tags:
        - Authentication
      description: ユーザーアカウントからログアウトします
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ログアウト成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully.
        '401':
          description: 認証エラー
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/UnauthorizedError'

  # Songs Endpoints
  '/player/songs/{id}':
    get:
      summary: 楽曲情報を取得
      tags:
        - Songs
      description: |
        楽曲情報を取得するAPIです。
        - クエリに `share_id` を含めた場合、共有回数を自動的にカウントします。
        - ログイン状態でアクセスした場合、共有曲として自動登録されます。
      parameters:
        - name: id
          in: path
          description: Song ID
          required: true
          schema:
            type: integer
            example: 1
        - name: share_id
          in: query
          description: 共有識別子(省略可)
          schema:
            type: string
            example: 'a1b2c3d4e5f6g7h8'
      responses:
        '200':
          description: 楽曲情報取得成功
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/SongDetailResponse'
        '404':
          description: 楽曲が見つからない
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/SongNotFoundError'

  '/users/received/songs':
    get:
      summary: 受信した共有楽曲一覧を取得
      tags:
        - Songs
      description: ユーザーが受信した共有楽曲の一覧を取得します
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 受信楽曲一覧取得成功
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      shared_song_data:
                        type: array
                        items:
                          '$ref': '#/components/schemas/SharedSongData'
                  - type: object
                    properties:
                      shared_song_data:
                        type: array
                        example: []
                      message:
                        type: string
                        example: 共有された曲はまだありません
        '401':
          description: 認証エラー
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/UnauthorizedError'

  '/users/songs/{song_id}/unlock':
    post:
      summary: 共有楽曲のロック解除
      tags:
        - Songs
      description: パスワードで保護された共有楽曲のロックを解除し、共有可能な楽曲として登録します
      security:
        - BearerAuth: []
      parameters:
        - name: song_id
          in: path
          description: Song ID
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  example: 'secret123'
                  description: 楽曲のロック解除用パスワード
              required:
                - password
      responses:
        '200':
          description: ロック解除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    '$ref': '#/components/schemas/SongUnlockResponse'
        '400':
          description: エラー
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code:
                    type: string
                    example: 'INVALID_PASSWORD'
        '401':
          description: 認証エラー
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/UnauthorizedError'

  '/songs':
    post:
      summary: 新規楽曲作成
      tags:
        - Songs
      description: 新しい楽曲を作成します
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: 'Pretender'
                  description: 楽曲名
                source_url:
                  type: string
                  example: 'https://storage.example.com/songs/pretender.mp3'
                  description: 音源ファイルのURL
                picture_url:
                  type: string
                  example: 'https://example.com/songs/pretender/jacket.jpg'
                  description: ジャケット画像のURL
                spotify_url:
                  type: string
                  example: 'https://open.spotify.com/track/15n0n0gT5b6d5g4g3f4g3g'
                  description: Spotifyの楽曲リンク
                apple_url:
                  type: string
                  example: 'https://music.apple.com/jp/album/pretender/1462432842?i=1462432845'
                  description: Apple Musicの楽曲リンク
                artist_name:
                  type: string
                  example: 'Official髭男dism'
                  description: アーティスト名
              required:
                - name
                - source_url
                - picture_url
                - artist_name
      responses:
        '200':
          description: 楽曲作成成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    '$ref': '#/components/schemas/SongDetailResponse'

  '/users/songs':
    get:
      summary: 共有可能な楽曲一覧を取得
      tags:
        - Songs
      description: ユーザーが共有可能な楽曲の一覧を取得します
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 共有可能楽曲一覧取得成功
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      '$ref': '#/components/schemas/SharableSongData'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: 共有できる曲はまだありません
        '401':
          description: 認証エラー
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/UnauthorizedError'

  '/users/shared/songs':
    get:
      summary: 共有済み楽曲一覧を取得
      tags:
        - Songs
      description: ユーザーが共有済みの楽曲の一覧を取得します
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 共有済み楽曲一覧取得成功
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      '$ref': '#/components/schemas/SharedSongData'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: まだ共有をしていません
        '401':
          description: 認証エラー
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/UnauthorizedError'

  '/ranking/{artist_id}':
    get:
      summary: アーティスト別共有ランキング取得
      tags:
        - Songs
      description: 指定されたアーティストの楽曲の共有ランキングを取得します
      parameters:
        - name: artist_id
          in: path
          description: Artist ID
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: ランキング取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      '$ref': '#/components/schemas/SongRankingData'

  # Artists Endpoints
  '/artists/{artist_id}':
    get:
      summary: アーティスト情報を取得
      tags:
        - Artists
      description: 指定されたアーティストの詳細情報を取得します
      parameters:
        - name: artist_id
          in: path
          description: Artist ID
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: アーティスト情報取得成功
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ArtistDetailResponse'
        '404':
          description: アーティストが見つからない
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ArtistNotFoundError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT認証トークンを使用してください

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
          description: ユーザーID
        email:
          type: string
          format: email
          example: user@example.com
          description: メールアドレス
        name:
          type: string
          example: 田中太郎
          description: ユーザー名
        share_id:
          type: string
          example: 'a1b2c3d4e5f6g7h8'
          description: 共有識別子
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'

    SongDetailResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
          description: 楽曲ID
        name:
          type: string
          example: 'Pretender'
          description: 楽曲名
        source_url:
          type: string
          example: 'https://storage.example.com/songs/pretender.mp3'
          description: 音源(mp3)ファイルのURL
        picture_url:
          type: string
          example: 'https://example.com/songs/pretender/jacket.jpg'
          description: ジャケット画像のURL
        spotify_url:
          type: string
          example: 'https://open.spotify.com/track/15n0n0gT5b6d5g4g3f4g3g'
          description: Spotifyの楽曲リンク
        apple_url:
          type: string
          example: 'https://music.apple.com/jp/album/pretender/1462432842?i=1462432845'
          description: Apple Musicの楽曲リンク
        artist_name:
          type: string
          example: 'Official髭男dism'
          description: アーティスト名
        artist_id:
          type: integer
          example: 1
          description: アーティストID（外部キー）
      required:
        - id
        - name
        - source_url
        - picture_url
        - artist_id

    ArtistDetailResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
          description: アーティストID
        name:
          type: string
          example: 'Official髭男dism'
          description: アーティスト名
        spotify_url:
          type: string
          example: 'https://open.spotify.com/artist/24jgrM1lFxS2I3Up9gQrXj'
          description: Spotifyのアーティストリンク
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'

    SharedSongData:
      type: object
      properties:
        id:
          type: integer
          example: 1
          description: 楽曲ID
        name:
          type: string
          example: 'Pretender'
          description: 楽曲名
        source_url:
          type: string
          example: 'https://storage.example.com/songs/pretender.mp3'
          description: 音源ファイルのURL
        picture_url:
          type: string
          example: 'https://example.com/songs/pretender/jacket.jpg'
          description: ジャケット画像のURL
        spotify_url:
          type: string
          example: 'https://open.spotify.com/track/15n0n0gT5b6d5g4g3f4g3g'
          description: Spotifyの楽曲リンク
        apple_url:
          type: string
          example: 'https://music.apple.com/jp/album/pretender/1462432842?i=1462432845'
          description: Apple Musicの楽曲リンク
        artist_name:
          type: string
          example: 'Official髭男dism'
          description: アーティスト名
        shared_count:
          type: integer
          example: 15
          description: 共有回数
        shared_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
          description: 共有日時

    SharableSongData:
      type: object
      properties:
        id:
          type: integer
          example: 1
          description: 楽曲ID
        name:
          type: string
          example: 'Pretender'
          description: 楽曲名
        picture_url:
          type: string
          example: 'https://example.com/songs/pretender/jacket.jpg'
          description: ジャケット画像のURL
        artist_name:
          type: string
          example: 'Official髭男dism'
          description: アーティスト名
        is_password_protected:
          type: boolean
          example: true
          description: パスワード保護の有無
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
          description: 作成日時

    SongUnlockResponse:
      type: object
      properties:
        song:
          '$ref': '#/components/schemas/SongDetailResponse'
        message:
          type: string
          example: '楽曲のロックが解除されました'
        unlocked_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'

    SongRankingData:
      type: object
      properties:
        song_id:
          type: integer
          example: 1
          description: 楽曲ID
        song_name:
          type: string
          example: 'Pretender'
          description: 楽曲名
        artist_name:
          type: string
          example: 'Official髭男dism'
          description: アーティスト名
        picture_url:
          type: string
          example: 'https://example.com/songs/pretender/jacket.jpg'
          description: ジャケット画像のURL
        shared_count:
          type: integer
          example: 15
          description: 共有回数
        rank:
          type: integer
          example: 1
          description: ランキング順位

    SongNotFoundError:
      type: object
      properties:
        error:
          type: string
          example: 'Song not found'
          description: 楽曲が存在しない場合のエラーメッセージ

    ArtistNotFoundError:
      type: object
      properties:
        error:
          type: string
          example: 'Artist not found'
          description: アーティストが存在しない場合のエラーメッセージ

    # Authentication Error Schemas
    UnauthorizedError:
      type: object
      properties:
        error:
          type: string
          example: 'Unauthorized'
          description: 認証が必要な場合のエラーメッセージ
        message:
          type: string
          example: 'You need to sign in or sign up before continuing.'
          description: 詳細なエラーメッセージ
        error_code:
          type: string
          example: 'UNAUTHORIZED'
          description: エラーコード
      required:
        - error

    LoginError:
      type: object
      properties:
        error:
          type: string
          example: 'Invalid Email or password.'
          description: ログイン失敗時のエラーメッセージ
        message:
          type: string
          example: 'Invalid Email or password.'
          description: 詳細なエラーメッセージ
        error_code:
          type: string
          example: 'INVALID_CREDENTIALS'
          description: エラーコード
      required:
        - error

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: 'Validation failed'
          description: バリデーション失敗時のメッセージ
        errors:
          type: array
          items:
            type: string
          example:
            - 'Email can\'t be blank'
            - 'Password is too short (minimum is 6 characters)'
            - 'Name can\'t be blank'
          description: バリデーションエラーの詳細リスト
        error_code:
          type: string
          example: 'VALIDATION_ERROR'
          description: エラーコード
      required:
        - message
        - errors

    ForbiddenError:
      type: object
      properties:
        error:
          type: string
          example: 'Forbidden'
          description: アクセス権限がない場合のエラーメッセージ
        message:
          type: string
          example: 'You don\'t have permission to access this resource.'
          description: 詳細なエラーメッセージ
        error_code:
          type: string
          example: 'FORBIDDEN'
          description: エラーコード
      required:
        - error

    TokenExpiredError:
      type: object
      properties:
        error:
          type: string
          example: 'Token has expired'
          description: JWTトークンの有効期限切れメッセージ
        message:
          type: string
          example: 'Your session has expired. Please log in again.'
          description: 詳細なエラーメッセージ
        error_code:
          type: string
          example: 'TOKEN_EXPIRED'
          description: エラーコード
      required:
        - error

    InvalidTokenError:
      type: object
      properties:
        error:
          type: string
          example: 'Invalid token'
          description: 無効なJWTトークンのメッセージ
        message:
          type: string
          example: 'The provided token is invalid or malformed.'
          description: 詳細なエラーメッセージ
        error_code:
          type: string
          example: 'INVALID_TOKEN'
          description: エラーコード
      required:
        - error

servers:
  - url: https://{defaultHost}
    variables:
      defaultHost:
        default: localhost:3000
        description: サーバーのホスト名
